[program:fasterup-portal]
command=/opt/fasterup-portal/venv/bin/gunicorn --workers 2 --bind 127.0.0.1:5000 --timeout 60 --access-logfile /opt/fasterup-portal/logs/gunicorn-access.log --error-logfile /opt/fasterup-portal/logs/gunicorn-error.log --log-level info app.wsgi:application
directory=/opt/fasterup-portal
user=socadmin
group=socadmin
autostart=true
autorestart=true
startretries=3
stopwaitsecs=10
environment=PYTHONPATH="/opt/fasterup-portal",PATH="/opt/fasterup-portal/venv/bin:/usr/local/bin:/usr/bin:/bin",HOME="/home/socadmin"
stdout_logfile=/opt/fasterup-portal/logs/supervisor-stdout.log
stderr_logfile=/opt/fasterup-portal/logs/supervisor-stderr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
