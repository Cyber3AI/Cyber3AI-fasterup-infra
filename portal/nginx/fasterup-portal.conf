server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name portal.fasterup.local 192.168.0.22 10.0.0.22 _;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portal.fasterup.local 192.168.0.22 10.0.0.22 _;
    ssl_certificate     /etc/nginx/ssl/portal.crt;
    ssl_certificate_key /etc/nginx/ssl/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    root /var/www/fasterup-portal;
    index index.html;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    access_log /var/log/nginx/portal-ssl-access.log;
    error_log  /var/log/nginx/portal-ssl-error.log warn;
    location ~* (\.bak|\.(db|sqlite|sqlite3|env|log|py|pyc|ini|conf|sh|old|orig|swp)$) {
        deny all;
        return 404;
    }
    location ~ /\. {
        deny all;
        return 404;
    }
    location ^~ /wazuh/ {
        proxy_pass https://192.168.0.10/wazuh/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
    location = /wazuh { return 301 /wazuh/; }
    location = /misp-authcheck {
        internal;
        proxy_pass http://127.0.0.1:5000/api/misp/authcheck;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }
    location @misp_login { return 302 /login; }
    location ^~ /misp/ {
        auth_request /misp-authcheck;
        error_page 401 = @misp_login;
        proxy_pass https://192.168.0.21/;
        proxy_set_header Accept-Encoding "";
        sub_filter 'https://portal.fasterup.local/misp/misp/' '/misp/';
        sub_filter 'https://portal.fasterup.local' '';
        sub_filter_once off;
        sub_filter_types text/css application/javascript text/javascript;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Misp-Auth "<REDACTED>";
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
    location = /misp { return 301 /misp/; }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ ^/(login|change-password)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
