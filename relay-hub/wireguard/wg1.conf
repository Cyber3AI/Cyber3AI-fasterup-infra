[Interface]
# HUB FasterUp WG1 — schema noua 10.0.0.0/8
# Created: 2026-04-29 by SOC migration
Address = 10.0.0.1/8
ListenPort = 51821
PrivateKey = <REDACTED>

# Enable IP forwarding for routing between peers
PostUp = sysctl -w net.ipv4.ip_forward=1
PostUp = iptables -I FORWARD 1 -i %i -o %i -j ACCEPT
PostUp = iptables -I FORWARD 2 -i %i -j ACCEPT
PostUp = iptables -I FORWARD 1 -s 10.1.23.0/29 -d 10.0.0.22 -p tcp --dport 80 -j ACCEPT -m comment --comment "fasterup-analyst HTTP to portal"
PostUp = iptables -I FORWARD 2 -s 10.1.23.0/29 -d 10.0.0.22 -p tcp --dport 443 -j ACCEPT -m comment --comment "fasterup-analyst HTTPS to portal"
PostUp = iptables -I FORWARD 3 -s 10.0.0.22 -d 10.1.23.0/29 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT -m comment --comment "fasterup-analyst replies from portal"
PostUp = iptables -I FORWARD 4 -s 10.1.23.0/29 -j DROP -m comment --comment "fasterup-analyst DROP all else"
PostUp = iptables -I FORWARD 5 -d 10.1.23.0/29 -j DROP -m comment --comment "fasterup-analyst DROP inbound else"
PostUp = iptables -I FORWARD 6 -m iprange --src-range 10.1.100.0-10.1.114.255 -d 10.0.0.22 -p tcp --dport 443 -j ACCEPT -m comment --comment "ICISOC-analyst HTTPS to portal"
PostUp = iptables -I FORWARD 7 -m iprange --src-range 10.1.100.0-10.1.114.255 -d 10.0.0.22 -p tcp --dport 80 -j ACCEPT -m comment --comment "ICISOC-analyst HTTP to portal"
PostUp = iptables -I FORWARD 8 -s 10.0.0.22 -m iprange --dst-range 10.1.100.0-10.1.114.255 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT -m comment --comment "ICISOC-analyst replies from portal"
PostUp = iptables -I FORWARD 9 -m iprange --src-range 10.1.100.0-10.1.114.255 -j DROP -m comment --comment "ICISOC-analyst DROP all else (lateral)"
PostUp = iptables -I FORWARD 10 -m iprange --dst-range 10.1.100.0-10.1.114.255 -j DROP -m comment --comment "ICISOC-analyst DROP inbound else"
PostUp = iptables -I INPUT 1 -i %i -m iprange --src-range 10.1.100.0-10.1.114.255 -j DROP -m comment --comment "ICISOC-analyst DROP to HUB itself"
PostDown = iptables -D FORWARD -i %i -o %i -j ACCEPT
PostDown = iptables -D FORWARD -i %i -j ACCEPT
PostDown = iptables -D FORWARD -d 10.1.23.0/29 -j DROP -m comment --comment "fasterup-analyst DROP inbound else"
PostDown = iptables -D FORWARD -s 10.1.23.0/29 -j DROP -m comment --comment "fasterup-analyst DROP all else"
PostDown = iptables -D FORWARD -s 10.0.0.22 -d 10.1.23.0/29 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT -m comment --comment "fasterup-analyst replies from portal"
PostDown = iptables -D FORWARD -s 10.1.23.0/29 -d 10.0.0.22 -p tcp --dport 443 -j ACCEPT -m comment --comment "fasterup-analyst HTTPS to portal"
PostDown = iptables -D FORWARD -s 10.1.23.0/29 -d 10.0.0.22 -p tcp --dport 80 -j ACCEPT -m comment --comment "fasterup-analyst HTTP to portal"
PostDown = iptables -D INPUT -i %i -m iprange --src-range 10.1.100.0-10.1.114.255 -j DROP -m comment --comment "ICISOC-analyst DROP to HUB itself"
PostDown = iptables -D FORWARD -m iprange --dst-range 10.1.100.0-10.1.114.255 -j DROP -m comment --comment "ICISOC-analyst DROP inbound else"
PostDown = iptables -D FORWARD -m iprange --src-range 10.1.100.0-10.1.114.255 -j DROP -m comment --comment "ICISOC-analyst DROP all else (lateral)"
PostDown = iptables -D FORWARD -s 10.0.0.22 -m iprange --dst-range 10.1.100.0-10.1.114.255 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT -m comment --comment "ICISOC-analyst replies from portal"
PostDown = iptables -D FORWARD -m iprange --src-range 10.1.100.0-10.1.114.255 -d 10.0.0.22 -p tcp --dport 80 -j ACCEPT -m comment --comment "ICISOC-analyst HTTP to portal"
PostDown = iptables -D FORWARD -m iprange --src-range 10.1.100.0-10.1.114.255 -d 10.0.0.22 -p tcp --dport 443 -j ACCEPT -m comment --comment "ICISOC-analyst HTTPS to portal"

